name: Deploy Frontend to S3

# trigger the workflow on pushes to the main branch 
on:
  push:
    branches:
      - main

  # allow manual trigger from GitHub UI 
  workflow_dispatch:


permissions:
  contents: read  # workflow needs repo read access

env:
  NODE_VERSION: "22"  # centralize node version used across all workflow steps

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-24.04

    # associates deployment with github environment, which can be used for environment-specific secrets, deployment history, and manual approval
    environment:
      name: production

    steps:
      # checkout the source code from the repository to the runner
      - name: Checkout Source
        uses: actions/checkout@v4

      # install the required node version and cache npm dependencies to speed up future workflow runs
      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # install dependencies using package-lock.json to ensure consistent builds across environments
      - name: Install Dependencies
        run: npm ci

      # run tests if they exist, but don't fail if there are no tests   
      - name: Run Tests
        run: npm test --if-present

      # generate the production ready frontend assets such as HTML, CSS, JavaScript, and static files.
      - name: Build Application
        run: npm run build

      # authenticate with AWS using credentials stored in GitHub secrets, required for s3 deployment and cloudfront operations
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # upload the contents of the build files to the s3 bucket. the --delete flag removes old files from s3 that no longer exist in latest build
      - name: Deploy Build Folder
        run: |
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET }} \
            --delete

      # clear the cloudfront cache to ensure users get the latest files immediately instead of cached versions from CDN Locations.
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"

      # print a success message to the workflow logs to indicate deployment completion
      - name: Deployment Summary
        run: echo "Production deployment successful!"

  send-email-notification:
    name: Notify Stakeholders via Email

    runs-on: ubuntu-24.04

    # Wait for deploy job to complete
    needs: deploy

    # Run even if deploy fails or gets cancelled
    if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "STATUS=SUCCESS" >> $GITHUB_ENV
            echo "ICON=✅" >> $GITHUB_ENV
          elif [ "${{ needs.deploy.result }}" = "cancelled" ]; then
            echo "STATUS=CANCELLED" >> $GITHUB_ENV
            echo "ICON=🚫" >> $GITHUB_ENV
          else
            echo "STATUS=FAILED" >> $GITHUB_ENV
            echo "ICON=❌" >> $GITHUB_ENV
          fi
      - name: Extract Commit Details
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "MERGE_DETAILS<<EOF" >> $GITHUB_ENV
          echo "$COMMIT_MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "${{ env.ICON }} Deployment ${{ env.STATUS }} - ${{ github.repository }}"

          to: ${{ secrets.EMAIL_TO }}

          from: GitHub Actions CI/CD <${{ secrets.SMTP_USERNAME }}>

          html_body: |
            <h2>${{ env.ICON }} Deployment ${{ env.STATUS }}</h2>
            <p>
              The GitHub Actions workflow has completed.
            </p>
            <h3>📦 Deployment Details</h3>
            <ul>
              <li><strong>Deployment Type:</strong> Frontend (S3 + CloudFront)</li>
              <li><strong>Repository:</strong> ${{ github.repository }}</li>
              <li><strong>Branch:</strong> ${{ github.ref_name }}</li>              
              <li><strong>Environment:</strong> Production</li>
              <li><strong>Triggered By:</strong> ${{ github.actor }}</li>
              <li><strong>Workflow:</strong> ${{ github.workflow }}</li>
              <li><strong>Deployment Result:</strong> ${{ needs.deploy.result }}</li>
              <li><strong>Commit SHA:</strong> ${{ github.sha }}</li>
            </ul>
            <h3>🔀 Latest Commit Details</h3>
            <pre>${{ env.MERGE_DETAILS }}</pre>
            <h3>🔗 Workflow Logs</h3>
            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View GitHub Actions Run #${{ github.run_number }}
              </a>
            </p>